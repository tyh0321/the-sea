/* ============ 图片加载器（含加载进度，供 loading 动画用） ============ */
const IMG = { total:0, done:0 };
function loadImg(key, url){
  if(!url) return;
  IMG.total++;
  const im = new Image();
  const settle = ()=>{ IMG.done++; };
  im.onload  = ()=>{ IMG[key] = im; settle(); };
  im.onerror = ()=>{ IMG[key] = null; settle(); };
  im.src = url;
}
['bg','picker','turtle','fish','trash0','trash1','trash2','trash3','trash4','qr'].forEach(k=>loadImg(k, ASSETS[k]));

  bgm:null, pickup:null, gameover:null, muted:false, unlocked:false,
  mk(src, loop, vol){ if(!src) return null; const a=new Audio(src);
    a.preload='auto'; if(loop)a.loop=true; a.volume=vol;
    a.addEventListener('error',()=>{}); return a; },
  init(){ try{
      this.bgm     = this.mk(ASSETS.bgm, true, 0.3);
      this.pickup  = this.mk(ASSETS.pickup, false, 0.6);
      this.gameover= this.mk(ASSETS.gameover, false, 0.7);
    }catch(e){} },
  unlock(){ if(this.unlocked) return; this.unlocked=true; this.playBg(); },
  _play(a){ if(this.muted||!a) return; try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){} },
  playBg(){ try{ if(this.bgm) this.bgm.play().catch(()=>{}); }catch(e){} },
  stopBg(){ try{ if(this.bgm){ this.bgm.pause(); this.bgm.currentTime=0; } }catch(e){} },
  playPick(){ this._play(this.pickup); },
  playOver(){ this.stopBg(); this._play(this.gameover); }
};

const BG_KINDS=['turtle','fish','jelly','whale'];
function spawnBgCreature(){
  const kind=BG_KINDS[Math.floor(Math.random()*BG_KINDS.length)];
  const s=0.5+Math.random()*0.35, fromLeft=Math.random()<0.5;
  bgCreatures.push({kind,s,x:fromLeft?-70:W+70,y:40+Math.random()*(H-260),
    dir:fromLeft?1:-1,spd:20+Math.random()*22,phase:Math.random()*6.28});
}
function drawBgCreatures(){
  bgCreatures.forEach(b=>{
    ctx.save(); ctx.globalAlpha=0.30; ctx.translate(b.x,b.y); ctx.scale(b.s*b.dir,b.s);
    const col='rgba(150,205,235,0.95)'; ctx.fillStyle=col; ctx.strokeStyle=col;
    if(b.kind==='turtle'){
      ctx.beginPath();ctx.ellipse(0,0,26,20,0,0,6.28);ctx.fill();
      ctx.beginPath();ctx.ellipse(28,0,9,8,0,0,6.28);ctx.fill();
      const f=Math.sin(b.phase)*0.4; ctx.save();ctx.rotate(f);
      ctx.beginPath();ctx.ellipse(-6,-20,10,6,-0.4,0,6.28);ctx.fill();
      ctx.beginPath();ctx.ellipse(-6,20,10,6,0.4,0,6.28);ctx.fill();ctx.restore();
    } else if(b.kind==='fish'){
      ctx.beginPath();ctx.ellipse(0,0,22,14,0,0,6.28);ctx.fill();
      ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(-38,-12);ctx.lineTo(-38,12);ctx.closePath();ctx.fill();
    } else if(b.kind==='jelly'){
      ctx.beginPath();ctx.arc(0,0,18,Math.PI,0);ctx.fill();
      ctx.lineWidth=2.5; for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*7,0);
        ctx.quadraticCurveTo(i*7+Math.sin(b.phase+i)*6,16,i*7,30);ctx.stroke();}
    } else {
      ctx.beginPath();ctx.ellipse(0,0,44,18,0,0,6.28);ctx.fill();
      ctx.beginPath();ctx.moveTo(-42,0);ctx.lineTo(-60,-15);ctx.lineTo(-60,15);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  });
}
function buildBG(){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,C.bgTop); gr.addColorStop(0.55,C.bgMid); gr.addColorStop(1,C.bgBot);
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){
    const x=120+i*260+Math.sin(i*2.1)*80, w=60+i*30;
    const lg=g.createLinearGradient(x,0,x+w,H);
    lg.addColorStop(0,'rgba(160,210,250,0.06)'); lg.addColorStop(1,'rgba(160,210,250,0)');
    g.save(); g.translate(x,0); g.transform(1,0,0.18,1,0,0);
    g.fillStyle=lg; g.fillRect(0,0,w,H); g.restore();
  }
  g.strokeStyle=C.rowLine; g.lineWidth=1; g.setLineDash([12,18]);
  for(let i=1;i<ROWS;i++){g.beginPath();g.moveTo(0,i*ROW_H);g.lineTo(W,i*ROW_H);g.stroke();}
  g.setLineDash([]);
  const vg=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  bgCache=c;
  dustList=[]; for(let i=0;i<70;i++) dustList.push({x:Math.random()*W,y:Math.random()*H,
    r:0.4+Math.random()*1.6, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*5,
    a:0.06+Math.random()*0.18});
}

/* ============ 难度曲线 ============ */
const trashInt  = t => t < TRASH_INT.t1 ? TRASH_INT.i0 : t < TRASH_INT.t2 ? TRASH_INT.i1 : TRASH_INT.i2;
const creInt    = t => Math.max(CRE_INT_MIN, CRE_INT_BASE - Math.floor(t / CRE_INT_STEP));
const creMul    = t => Math.min(CRE_SPD_MAX, 1 + Math.floor(t / CRE_INT_STEP) * CRE_SPD_STEP);
const rowBlocked = r => creList.some(c=>c.row===r) || pendList.some(p=>p.row===r);
const freeRows   = ()=>{ const a=[]; for(let i=0;i<ROWS;i++) if(!rowBlocked(i)) a.push(i); return a; };

/* ============ 工具 ============ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y,x+r,y);c.closePath();}
// 本次清理避免的"降解污染总年数" = Σ(每种收集数 × 对应年限)
function totalYears(){ let s=0; for(let i=0;i<collected.length;i++) s+=(collected[i]||0)*TRASH_YEARS[i]; return s; }

/* ============ 生成 ============ */
function spawnTrash(){
  const rows=freeRows(); if(!rows.length) return;
  const row=rows[Math.floor(Math.random()*rows.length)];
  const kind=Math.floor(Math.random()*C.trash.length);
  const sz=TRASH_SZ[kind]; const w=sz.w, h=sz.h;
  const x=W+10, y=row*ROW_H+(ROW_H-h)/2;
  const box={x,y,w,h};
  for(const t of trashList){ if(t.row!==row) continue; if(!separate(box,t,TRASH_GAP)) return; }
  trashList.push({x,y,w,h,row,spd:TRASH_SPEED,kind,phase:Math.random()*6.28});
}
function separate(a,b,g){return a.x+a.w+g<=b.x||b.x+b.w+g<=a.x||a.y+a.h+g<=b.y||b.y+b.h+g<=a.y;}

function enqueueCreature(){
  const rows=[]; for(let i=0;i<ROWS;i++) if(!creList.some(c=>c.row===i)&&!pendList.some(p=>p.row===i)) rows.push(i);
  if(!rows.length) return;
  if(creList.length+pendList.length>=MAX_CRE) return;
  const row=rows[Math.floor(Math.random()*rows.length)];
  pendList.push({row, timer:WARN_TIME+(roleP.warnAdd||0)});
}
function spawnCreature(row){
  if(creList.length>=MAX_CRE) return false;
  for(const t of trashList) if(t.row===row && t.x+t.w < CRE_SAFE+60) return false;
  const kind=Math.random()<0.55?'turtle':'fish';
  const w=kind==='turtle'?120:84, h=kind==='turtle'?78:50;
  creList.push({x:-w-20, y:row*ROW_H+(ROW_H-h)/2, w, h, row, kind,
                spd:CRE_BASE*creMul(gt), phase:Math.random()*6.28});
  return true;
}

/* ============ 逻辑 ============ */
function startGame(){
  phase='play'; gt=0; score=0; saved=0; tTimer=0; cTimer=0; overT=0; scorePop=0;
  trashList=[]; creList=[]; pendList=[]; floats=[]; cards=[]; funCards=[]; collected=[0,0,0,0,0];
  deathReason=''; tutT=0;
  roleP=ROLE_BONUS[role]||ROLE_BONUS.tst; shield=roleP.shield;
  bgCreatures=[]; restored=0;
  picker.x=180; picker.y=H/2-PICKER/2; picker.a=0; picker.pulse=0;
  SFX.unlock();
}
function endGame(reason){
  phase='over'; overT=0; SFX.playOver();
  deathReason = reason || '海洋生态系统承受了不可挽回的扰动。';
  if(score>best){best=score; localStorage.setItem('oc_best',best);}
}
function pushCard(kind){
  const f = TRASH_FACTS[kind%TRASH_FACTS.length];
  const ml=CARD_HOLD+(roleP.cardExtra||0); cards = [ { name:f.name, year:f.year, sub:f.sub, detail:f.detail, act:f.act, life:ml, maxLife:ml } ];
}
function pushFun(){
  funCards = [ { txt:FUN_FACTS[Math.floor(Math.random()*FUN_FACTS.length)], life:FUN_HOLD } ];
}
function rankOf(s){
  if(s>=60) return {t:'海洋守护者', c:'#ffd24a'};
  if(s>=30) return {t:'环保先锋',   c:'#5fd0a0'};
  if(s>=12) return {t:'净海行动派', c:'#7ab8ff'};
  return {t:'初醒的拾荒者', c:'#c8c4bc'};
}

function update(dt){
  if(phase==='intro'){introT+=dt; if(introT>=INTRO_TIME) phase='title'; return;}
  if(phase==='over'){overT+=dt; return;}
  if(phase!=='play') return;
  gt+=dt; tutT+=dt;
  let mx=0,my=0,moving=false;
  if(joy.on && joy.dist>JOY_DEAD){
    const sp = joy.dist>=JOY_GEAR ? GEAR2 : GEAR1;
    mx=joy.dx*sp; my=joy.dy*sp; moving=true;
  } else {
    let kx=0,ky=0;
    if(keys.ArrowLeft||keys.KeyA) kx--; if(keys.ArrowRight||keys.KeyD) kx++;
    if(keys.ArrowUp||keys.KeyW) ky--;   if(keys.ArrowDown||keys.KeyS) ky++;
    if(kx||ky){ const l=Math.hypot(kx,ky)||1; const sp=(keys.ShiftLeft||keys.ShiftRight)?GEAR2:GEAR1;
      mx=kx/l*sp; my=ky/l*sp; moving=true; }
  }
  picker.x+=mx*dt; picker.y+=my*dt;
  picker.x=clamp(picker.x,0,W-PICKER); picker.y=clamp(picker.y,0,H-PICKER);
  if(moving){ let tgt=Math.atan2(my,mx); let d=tgt-picker.a;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; picker.a+=d*0.2;
    picker.prop+=dt*12; }
  picker.pulse=Math.max(0,picker.pulse-dt*5);
  tTimer+=dt; if(tTimer>=trashInt(gt)){tTimer=0; spawnTrash();}
  cTimer+=dt; if(cTimer>=creInt(gt)){cTimer=0; enqueueCreature();}
  for(let i=pendList.length-1;i>=0;i--){
    const p=pendList[i]; p.timer-=dt;
    if(p.timer<=0){
      if(spawnCreature(p.row)){ pendList.splice(i,1); }
      else { p.timer=0.3; }
    }
  }
  for(let i=trashList.length-1;i>=0;i--){ trashList[i].x-=trashList[i].spd*dt; trashList[i].phase+=dt*2;
    if(trashList[i].x+trashList[i].w<-30) trashList.splice(i,1); }
  for(let i=creList.length-1;i>=0;i--){ const c=creList[i]; c.x+=c.spd*dt; c.phase+=dt*3;
    if(c.x>W+40){ saved++; creList.splice(i,1); } }
  const hp=HIT_PICKER+(roleP.hitAdd||0); const pb={x:picker.x+PICKER*(1-hp)/2, y:picker.y+PICKER*(1-hp)/2,
            w:PICKER*hp, h:PICKER*hp};
  for(let i=trashList.length-1;i>=0;i--){ const t=trashList[i];
    const tb={x:t.x+t.w*(1-HIT_TRASH)/2, y:t.y+t.h*(1-HIT_TRASH)/2, w:t.w*HIT_TRASH, h:t.h*HIT_TRASH};
    if(aabb(pb,tb)){
      score++; scorePop=0.16;
      floats.push({x:t.x+t.w/2, y:t.y, txt:'+1', life:0.75});
      pushCard(t.kind);
      if(collected[t.kind]!=null) collected[t.kind]++;
      if(score%5===0) pushFun();          // 每收集满 5 的倍数弹冷知识彩蛋
      restored++; spawnBgCreature();      // 因果链：每清理一件，就有一只生物重返海洋
      SFX.playPick();
      picker.pulse=1; trashList.splice(i,1);
    }
  }
  for(const c of creList){
    if(aabb(pb,c)){ endGame('你的拾取器碰到了海洋生物——它们需要畅通无阻的航道。'); return; }
    for(let ti=trashList.length-1;ti>=0;ti--){ const t=trashList[ti];
      if(aabb(c,t)){
        if(shield>0){ shield--; trashList.splice(ti,1);
          floats.push({x:c.x+30,y:c.y-6,txt:'豁免 · 生物避开垃圾',life:1.1}); continue; }
        endGame('海洋生物撞上了塑料垃圾——它们无法分辨食物与垃圾。'); return;
      }
    }
  }
  for(let i=floats.length-1;i>=0;i--){ floats[i].y-=50*dt; floats[i].life-=dt; if(floats[i].life<=0) floats.splice(i,1); }
  for(let i=cards.length-1;i>=0;i--){ cards[i].life-=dt; if(cards[i].life<=0) cards.splice(i,1); }
  for(let i=funCards.length-1;i>=0;i--){ funCards[i].life-=dt; if(funCards[i].life<=0) funCards.splice(i,1); }
  scorePop=Math.max(0,scorePop-dt);
  for(let i=bgCreatures.length-1;i>=0;i--){ const b=bgCreatures[i]; b.x+=b.dir*b.spd*dt; b.phase+=dt*2;
    if(b.dir<0 && b.x<-80) bgCreatures.splice(i,1); else if(b.dir>0 && b.x>W+80) bgCreatures.splice(i,1); }
  for(const d of dustList){ d.x+=d.vx*dt; d.y+=d.vy*dt; if(d.x<0)d.x=W; if(d.x>W)d.x=0; if(d.y<0)d.y=H; if(d.y>H)d.y=0; }
}

    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(0,0,11,0,6.28); ctx.fill();

  ctx.restore();

function drawTutorial(){

  let a;

  else if(tutT>TUTORIAL_TIME-outD) a=(TUTORIAL_TIME-tutT)/outD;
  else a=1;

/* =============================================================
   分享海报（1080x1920）：赛事文案 + 称号徽章 + 超大战绩 + 清理明细
   + 数据化锚点(减少降解年数) + 挑战钩子 + 数据出处 + 二维码/短链(传播闭环)
   Web Share 优先，浮层长按保存兜底
   ============================================================== */
function buildPosterCanvas(){
  const pw=1080, ph=1920;
  const pc=document.createElement('canvas'); pc.width=pw; pc.height=ph;
  const p=pc.getContext('2d');
  const g=p.createLinearGradient(0,0,0,ph);
  g.addColorStop(0,'#06182b'); g.addColorStop(0.5,'#0a2942'); g.addColorStop(1,'#04101c');
  p.fillStyle=g; p.fillRect(0,0,pw,ph);
  if(IMG.bg){ p.globalAlpha=0.18; p.drawImage(IMG.bg,0,0,pw,ph); p.globalAlpha=1; }
  p.save(); p.globalAlpha=0.08; p.fillStyle='#bfe6ff';
  for(let i=0;i<4;i++){ const x=120+i*240; p.beginPath(); p.moveTo(x,0); p.lineTo(x+80,0); p.lineTo(x+220,ph); p.lineTo(x-50,ph); p.fill(); }
  p.restore();
  p.textAlign='center'; p.textBaseline='middle';
  // 赛事关联文案（海报顶部）
  p.fillStyle='rgba(190,220,245,0.85)'; p.font='26px system-ui,sans-serif';
  p.fillText('【 '+EVENT+' 】', pw/2, 92);
  p.fillStyle='#d4a017'; p.font='bold 92px system-ui,sans-serif';
  p.fillText('深海拾荒者', pw/2, 168);
  p.fillStyle='rgba(255,210,74,0.95)'; p.font='bold 34px system-ui,sans-serif';
  p.fillText(SUBTITLE, pw/2, 232);
  p.fillStyle='rgba(190,220,245,0.72)'; p.font='26px system-ui,sans-serif';
  p.fillText('我刚刚为海洋做了一次清理', pw/2, 270);
  const cx=110, cy=300, cw=pw-220, ch=540;
  const cg=p.createLinearGradient(cx,cy,cx,cy+ch);
  cg.addColorStop(0,'rgba(20,60,95,0.55)'); cg.addColorStop(1,'rgba(8,28,48,0.7)');
  p.fillStyle=cg; rr(p,cx,cy,cw,ch,28); p.fill();
  p.strokeStyle='rgba(212,160,23,0.65)'; p.lineWidth=3; p.stroke();
  const rk=rankOf(score); const bt='称号 · '+rk.t;
  p.font='bold 44px system-ui,sans-serif';
  const btw=p.measureText(bt).width+64;
  p.fillStyle='rgba(255,255,255,0.08)'; rr(p,pw/2-btw/2, cy+30, btw, 66, 33); p.fill();
  p.strokeStyle=rk.c; p.lineWidth=2; p.stroke();
  p.fillStyle=rk.c; p.fillText(bt, pw/2, cy+63);
  p.fillStyle='#ffd24a'; p.font='bold 140px system-ui,sans-serif';
  p.fillText(String(score), pw/2, cy+198);
  p.fillStyle='rgba(230,236,242,0.86)'; p.font='30px system-ui,sans-serif';
  p.fillText('件海洋垃圾被我清理', pw/2, cy+274);
  p.strokeStyle='rgba(255,255,255,0.14)'; p.lineWidth=2;
  p.beginPath(); p.moveTo(cx+60, cy+312); p.lineTo(cx+cw-60, cy+312); p.stroke();
  p.fillStyle='#5fd0a0'; p.font='bold 72px system-ui,sans-serif';
  p.fillText(String(saved), pw/2, cy+386);
  p.fillStyle='rgba(230,236,242,0.86)'; p.font='30px system-ui,sans-serif';
  p.fillText('只海洋生物安全游过', pw/2, cy+452);
  // 清理明细：5 种垃圾小图 + 数量（贴图缺失画圆点占位）
  p.fillStyle='rgba(230,236,242,0.55)'; p.font='24px system-ui,sans-serif';
  p.fillText('—— 本次清理明细 ——', pw/2, 890);
  const names=['瓶','袋','罐','网','胎'];
  const cellW=(pw-2*150)/5, baseY=948;
  for(let i=0;i<5;i++){
    const ccx=150+cellW*i+cellW/2;
    const im=IMG['trash'+i];
    if(im){ try{p.filter='brightness(0.95) saturate(0.9)';}catch(e){}
      p.save(); p.translate(ccx, baseY); p.drawImage(im, -28, -28, 56, 56); p.restore();
      try{p.filter='none';}catch(e){}
    } else {
      p.fillStyle=C.trash[i].m; p.beginPath(); p.arc(ccx, baseY, 20, 0, 6.28); p.fill();
      p.fillStyle='#061018'; p.font='bold 20px system-ui,sans-serif'; p.fillText(names[i], ccx, baseY);
    }
    p.fillStyle='#ffd24a'; p.font='bold 28px system-ui,sans-serif';
    p.fillText('×'+(collected[i]||0), ccx, baseY+58);
  }
  // ===== 数据化锚点：减少降解污染年数（最具传播力的数字） =====
  const years = totalYears();
  const yearsStr = years.toLocaleString('en-US');
  p.fillStyle='rgba(230,236,242,0.9)'; p.font='30px system-ui,sans-serif';
  p.fillText('清理了 '+score+' 件海洋垃圾，拯救了 '+saved+' 只海洋生物', pw/2, 1074);
  p.fillStyle='rgba(230,236,242,0.7)'; p.font='28px system-ui,sans-serif';
  p.fillText('相当于减少了', pw/2, 1138);
  p.fillStyle='#ffd24a'; p.font='bold 104px system-ui,sans-serif';
  p.fillText(yearsStr+' 年', pw/2, 1212);
  p.fillStyle='rgba(230,236,242,0.7)'; p.font='28px system-ui,sans-serif';
  p.fillText('的塑料降解污染，被你亲手挡在海洋之外', pw/2, 1284);
  // 金句
  p.fillStyle='rgba(230,236,242,0.92)'; p.font='30px system-ui,sans-serif';
  p.fillText('每捡起一个瓶子，就有一只海鸟少一次误食。', pw/2, 1358);
  // 挑战钩子
  p.fillStyle='rgba(212,160,23,0.16)'; rr(p,140,1412,pw-280,92,16); p.fill();
  p.strokeStyle='rgba(212,160,23,0.6)'; p.lineWidth=2; p.stroke();
  p.fillStyle='#ffe08a'; p.font='bold 40px system-ui,sans-serif';
  p.fillText('扫码挑战你的海洋守护力  →', pw/2, 1458);
  // 话题标签
  p.fillStyle='rgba(140,196,245,0.9)'; p.font='28px system-ui,sans-serif';
  p.fillText('#深海拾荒者  #守护蔚蓝  #减塑生活', pw/2, 1552);
  // ===== 传播闭环：二维码 + 可复制短链文字 =====
  const _short = GAME_URL ? GAME_URL.replace(/^https?:\/\//,'').replace(/\/$/,'') : '';
  p.fillStyle='rgba(230,236,242,0.6)'; p.font='22px system-ui,sans-serif';
  p.fillText('扫码体验完整版', pw/2, 1616);
  const _qs=176, _qx=(pw-_qs)/2, _qy=1640;
  if(IMG.qr){
    p.fillStyle='#ffffff'; rr(p,_qx-10,_qy-10,_qs+20,_qs+20,10); p.fill();
    p.drawImage(IMG.qr, _qx, _qy, _qs, _qs);
  } else {
    p.fillStyle='#eef3f8'; rr(p,_qx-10,_qy-10,_qs+20,_qs+20,10); p.fill();
    p.strokeStyle='rgba(90,106,114,0.5)'; p.lineWidth=2; p.strokeRect(_qx,_qy,_qs,_qs);
    p.fillStyle='#5a6a72'; p.font='bold 16px system-ui,sans-serif';
    p.fillText('qr.png', pw/2, _qy+_qs/2);
  }
  // 数据出处(科普护城河: 出处直接嵌入传播产物)
  p.fillStyle='rgba(150,185,215,0.7)'; p.font='18px system-ui,sans-serif';
  p.fillText('降解年限：塑料瓶450年(UNEP 2021) · 渔网600年(FAO FTP No.533) 等', pw/2, 1852);
  p.fillStyle='rgba(180,210,235,0.82)'; p.font='20px system-ui,sans-serif';
  p.fillText(_short ? ('入口：'+_short) : '深海拾荒者 · 海洋环保科普互动游戏', pw/2, 1890);
  return pc;
}
function dataURLtoBlob(dataurl){
  try{
    const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1];
    const bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n);
    while(n--) u8[n]=bstr.charCodeAt(n);
    return new Blob([u8],{type:mime});
  }catch(e){ return null; }
}
let posterNode=null;
function ensurePosterOverlay(){
  if(posterNode) return posterNode;
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;background:rgba(2,8,14,0.93);z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;font-family:system-ui,sans-serif';
  wrap.innerHTML='<div style="color:#e6ecf2;font-size:18px;margin-bottom:10px;text-align:center">长按下方图片即可保存 / 分享给朋友</div>'+
    '<img id="posterImg" alt="战绩海报" style="max-width:min(48vh,92vw);max-height:76vh;border-radius:14px;box-shadow:0 0 40px rgba(0,0,0,.6);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto">'+
    '<div style="display:flex;gap:14px;margin-top:14px">'+
    '<a id="posterDl" style="display:none;padding:10px 22px;background:#2a9d8f;color:#fff;border-radius:10px;text-decoration:none;font-size:16px">下载图片</a>'+
    '<button id="posterClose" style="padding:10px 26px;background:#5a6a72;color:#fff;border:none;border-radius:10px;font-size:16px">返回游戏</button>'+
    '</div>';
  document.body.appendChild(wrap);
  wrap.querySelector('#posterClose').addEventListener('click', function(){ wrap.style.display='none'; });
  posterNode=wrap;
  return wrap;
}
function showPoster(dataurl, fileName){
  const wrap=ensurePosterOverlay();
  wrap.querySelector('#posterImg').src=dataurl;
  const dl=wrap.querySelector('#posterDl');
  if(dl){ dl.href=dataurl; dl.setAttribute('内部工具',fileName); dl.style.display='inline-block'; }
  wrap.style.display='flex';
  posterBusy=false;
}
function exportPoster(){
  if(posterBusy) return;
  posterBusy=true;
  let dataurl='';
  try{
    const pc=buildPosterCanvas();
    dataurl=pc.toDataURL('image/png');
  }catch(e){
    posterBusy=false;
    try{ alert('海报生成失败，请对本页截图分享 :)'); }catch(_){}
    return;
  }
  const fileName='深海拾荒者_清理'+score+'件.png';
  try{
    const blob=dataURLtoBlob(dataurl);
    if(blob && typeof navigator.share==='function' &&
       typeof navigator.canShare==='function' &&
       navigator.canShare({ files:[ new File([blob], fileName, {type:'image/png'}) ] })){
      const file=new File([blob], fileName, {type:'image/png'});
      navigator.share({ files:[file], title:'深海拾荒者',
        text:'【'+EVENT+'】我刚帮海洋清理了 '+score+' 件垃圾、减少了 '+totalYears().toLocaleString('en-US')+' 年降解污染、守护 '+saved+' 只海洋生物！'+(GAME_URL?('来挑战：'+GAME_URL):'你也来试试！') })
        .then(function(){ posterBusy=false; })
        .catch(function(){ showPoster(dataurl, fileName); });
      return;
    }
  }catch(e){}
  showPoster(dataurl, fileName);
}

/* ============ 输入 ============ */
function pos(e){ const r=cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
function hit(p,b){ return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h; }
function down(e){
  e.preventDefault(); const p=pos(e); SFX.unlock();
  if(posterNode && posterNode.style.display==='flex') return;
  if(phase==='intro'){ phase='title'; return; }
  if(phase==='source'){ if(hit(p,btnSourceBack)){ phase='title'; } return; }
  if(phase==='read'){
    for(const r of readRows){ if(hit(p,r)){ try{ window.open(r.url,'_blank'); }catch(e){} } }
    if(hit(p,btnReadBack)){ phase='title'; } return;
  }
  if(phase==='role'){
    for(const b of btnRole){ if(hit(p,b)){ role=b.key; startGame(); return; } }
    return;
  }
  if(phase==='title'){
    if(!allLoaded()) return;
    if(hit(p,btnStart)){ phase='rules'; return; }
    if(hit(p,btnSource)){ phase='source'; return; }
    if(hit(p,btnRead)){ phase='read'; return; }
    return;
  }
  if(phase==='rules'){ if(hit(p,btnSkip)){ phase='role'; return; } }
  if(phase==='over'&&overT>=DELAY_OVER){
    if(hit(p,btnAgain)){ phase='role'; return; }
    if(hit(p,btnPoster)){ exportPoster(); return; }
    if(btnOverRead && hit(p,btnOverRead)){ phase='read'; return; }
  }
  const dx=p.x-JOY_X, dy=p.y-JOY_Y, d=Math.hypot(dx,dy);
  if(d<JOY_R*2.4){ joy.on=true; joy._id=e.pointerId; setJoy(dx,dy,d); }
}
function move(e){ e.preventDefault(); if(!joy.on) return; const p=pos(e); setJoy(p.x-JOY_X,p.y-JOY_Y,Math.hypot(p.x-JOY_X,p.y-JOY_Y)); }
function up(e){ e.preventDefault(); joy.on=false; joy.dx=joy.dy=0; joy.dist=0; joy._id=null; }
function setJoy(dx,dy,d){ const c=Math.min(d,JOY_R); joy.dx=dx/(c||1)*(c/JOY_R); joy.dy=dy/(c||1)*(c/JOY_R); joy.dist=c/JOY_R; }
cvs.addEventListener('pointerdown',down);
window.addEventListener('pointermove',move,{passive:false});
window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
cvs.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>keys[e.code]=false);

/* ============ 适配 & 主循环 ============ */
function resize(){ const s=Math.min(innerWidth/W, innerHeight/H); cvs.style.width=(W*s|0)+'px'; cvs.style.height=(H*s|0)+'px'; }
addEventListener('resize',resize); resize();
let last=0;
(function loop(ts){ const dt=Math.min((ts-last)/1000,0.05); last=ts; update(dt); draw(); requestAnimationFrame(loop); })(0);
</script>
